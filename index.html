<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Musik Interaktif</title>
    <style>
        /* === TEMA DAN BACKGROUND === */
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            color: #58a6ff;
            border-bottom: 2px solid #30363d;
            padding-bottom: 10px;
            width: 100%;
            max-width: 500px;
        }

        /* === AREA INPUT === */
        .form-tambah {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
        }
        
        .form-tambah input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background-color: #161b22;
            color: white;
            font-size: 14px;
        }

        .form-tambah input:focus {
            outline: none;
            border-color: #1a73e8;
        }

        .form-tambah button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background-color: #1a73e8;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .form-tambah button:hover {
            background-color: #58a6ff;
            transform: scale(1.02);
        }

        /* === DAFTAR LAGU === */
        ul {
            list-style: none;
            padding: 0;
            width: 100%;
            max-width: 500px;
        }

        li {
            background-color: #161b22;
            margin: 15px 0;
            padding: 15px 15px 15px 80px;
            border-radius: 12px;
            border-left: 5px solid #1a73e8;
            transition: 0.3s;
            position: relative;
            display: flex;
            align-items: center;
            min-height: 100px;
            box-sizing: border-box;
        }

        li:hover {
            background-color: #1f242c;
            transform: translateY(-3px);
            border-left: 5px solid #58a6ff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* === EFEK VINYL (PIRINGAN HITAM) === */
        .vinyl {
            width: 44px;
            height: 44px;
            background: radial-gradient(circle, #222 30%, #000 70%);
            border-radius: 50%;
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%) rotate(0deg);
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #333;
            pointer-events: none;
        }

        .vinyl::before {
            content: '';
            position: absolute;
            width: 32px;
            height: 32px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .label-tengah {
            width: 14px;
            height: 14px;
            background-color: #1a73e8;
            border-radius: 50%;
            position: relative;
        }

        .label-tengah::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #0d1117;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes putar-vinyl {
            from { transform: translateY(-50%) rotate(0deg); }
            to { transform: translateY(-50%) rotate(360deg); }
        }

        li:hover .vinyl {
            animation: putar-vinyl 1.5s linear infinite;
        }

        /* === TOMBOL AKSI === */
        .btn-action {
            display: inline-block;
            text-decoration: none;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 8px;
            text-align: center;
            transition: 0.2s;
        }

        .btn-action:hover {
            transform: scale(1.05);
        }

        .btn-spotify {
            background-color: #1DB954;
            color: white !important;
        }

        .btn-genius {
            background-color: #fffc44;
            color: black !important;
        }

        /* === TOMBOL HAPUS === */
        .btn-delete {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }

        li:hover .btn-delete {
            opacity: 1;
        }

        .btn-delete:hover {
            transform: translateY(-50%) scale(1.2);
            filter: drop-shadow(0 0 5px #ff4d4d);
        }
/* Wadah untuk menampung kolom pencarian dan rekomendasi */
        .pencarian-container {
            position: relative;
            flex: 1;
        }

        /* Gaya untuk kotak rekomendasi yang muncul di bawah input */
        .kotak-rekomendasi {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            margin-top: 5px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            display: none; /* Sembunyikan dulu secara default */
        }

        /* Gaya untuk setiap baris lagu di dalam rekomendasi */
        .item-rekomendasi {
            padding: 10px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #21262d;
            font-size: 13px;
            color: #c9d1d9;
        }

        .item-rekomendasi:last-child {
            border-bottom: none;
        }

        .item-rekomendasi:hover {
            background-color: #1f242c;
            color: #58a6ff;
        }

        .item-rekomendasi img {
            width: 30px;
            height: 30px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="form-tambah">
        <div class="pencarian-container">
            <input type="text" id="inputLagu" placeholder="Ketik Artis atau Judul Lagu..." autocomplete="off">
            <div id="kotakRekomendasi" class="kotak-rekomendasi"></div>
        </div>
        <button id="tombolTambah">Tambah</button>
    </div>

    <h2>Daftar Playlist Kamu:</h2>
    <ul id="daftarLagu"></ul>

<script>
        const tombolTambah = document.getElementById('tombolTambah');
        const inputLagu = document.getElementById('inputLagu');
        const daftarLagu = document.getElementById('daftarLagu');
        const kotakRekomendasi = document.getElementById('kotakRekomendasi');

        // 1. FUNGSI UTAMA: Memasukkan lagu ke playlist
        function tambahLaguKePlaylist(judul, penyanyi, cover, audio) {
            const teksCari = encodeURIComponent(`${penyanyi} ${judul}`);
            const liBaru = document.createElement('li');
            liBaru.innerHTML = `
                <div class="vinyl"><div class="label-tengah"></div></div>
                <img src="${cover}" alt="Cover" style="width: 50px; height: 50px; border-radius: 6px; margin-right: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; margin-right: 30px;">
                    <strong style="font-size: 15px; color: #ffffff;">${judul}</strong>
                    <span style="font-size: 12px; color: #58a6ff;">${penyanyi}</span>
                    <audio controls src="${audio}" style="width: 100%; max-width: 200px; height: 24px; margin-top: 4px;"></audio>
                    <div style="display: flex; gap: 6px; margin-top: 4px;">
                        <a href="https://open.spotify.com/search/${teksCari}" target="_blank" class="btn-action btn-spotify">🎵 Spotify</a>
                        <a href="https://genius.com/search?q=${teksCari}" target="_blank" class="btn-action btn-genius">📄 Genius</a>
                    </div>
                </div>
                <button class="btn-delete" title="Hapus Lagu">🗑️</button>
            `;

            const tombolHapus = liBaru.querySelector('.btn-delete');
            tombolHapus.addEventListener('click', function() {
                liBaru.remove();
            });

            daftarLagu.appendChild(liBaru);
            kotakRekomendasi.style.display = 'none'; // Sembunyikan rekomendasi setelah dipilih
            inputLagu.value = ""; // Kosongkan inputan
        }

        // 2. FUNGSI OTOMATIS: Memunculkan rekomendasi saat mengetik
        inputLagu.addEventListener('input', function() {
            const keyword = inputLagu.value;

            // Jika ketikan masih terlalu pendek (kurang dari 3 huruf), jangan cari dulu
            if (keyword.trim().length < 3) {
                kotakRekomendasi.style.display = 'none';
                return;
            }

            const keywordAman = encodeURIComponent(keyword);

            // Cari hingga 5 lagu paling populer berdasarkan ketikan
            fetch(`https://itunes.apple.com/search?term=${keywordAman}&media=music&limit=5`)
                .then(response => response.json())
                .then(data => {
                    kotakRekomendasi.innerHTML = ""; // Bersihkan rekomendasi lama

                    if (data.results.length === 0) {
                        kotakRekomendasi.style.display = 'none';
                        return;
                    }

                    // Tampilkan kotak rekomendasi
                    kotakRekomendasi.style.display = 'block';

                    // Isi kotak dengan daftar lagu populer hasil pencarian
                    data.results.forEach(lagu => {
                        const item = document.createElement('div');
                        item.className = 'item-rekomendasi';
                        item.innerHTML = `
                            <img src="${lagu.artworkUrl100}" alt="Cover">
                            <div>
                                <strong style="display:block; color:#fff;">${lagu.trackName}</strong>
                                <span style="color:#8b949e; font-size:11px;">${lagu.artistName}</span>
                            </div>
                        `;

                        // Jika item rekomendasi diklik, langsung masukkan ke playlist
                        item.addEventListener('click', function() {
                            tambahLaguKePlaylist(lagu.trackName, lagu.artistName, lagu.artworkUrl100, lagu.previewUrl);
                        });

                        kotakRekomendasi.appendChild(item);
                    });
                })
                .catch(err => console.error("Gagal memuat rekomendasi:", err));
        });

        // Tombol Tambah manual jika user tetap ingin tekan tombol
        tombolTambah.addEventListener('click', function() {
            const keywordLagu = inputLagu.value;
            if (keywordLagu.trim() === "") return;

            const keywordAman = encodeURIComponent(keywordLagu);
            fetch(`https://itunes.apple.com/search?term=${keywordAman}&media=music&limit=1`)
                .then(response => response.json())
                .then(data => {
                    if (data.results.length > 0) {
                        const lagu = data.results[0];
                        tambahLaguKePlaylist(lagu.trackName, lagu.artistName, lagu.artworkUrl100, lagu.previewUrl);
                    } else {
                        alert("Lagu tidak ditemukan!");
                    }
                });
        });

        // Tutup kotak rekomendasi jika user mengklik di luar area pencarian
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.pencarian-container')) {
                kotakRekomendasi.style.display = 'none';
            }
        });
    </script>
</body>
</html>
